# One entry per industry (the name matches the file in templates/).
# approved: true  = leads in this industry may be emailed.
#           false = the sender skips them and leaves them waiting.
# uses: the approved SMS uses, for templates that have a {uses} slot (the first three
#       are used). The approved templates name their uses in their own fixed text, and
#       follow-ups name the first two uses here, so keep them in the same order.
